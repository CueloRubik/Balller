name: Lua checks
on:
  push:
    branches: [main, development, 'feature/**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4 love xvfb
      - name: Check syntax
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n 1 luac -p
      - name: Verify PNG sprites
        run: python3 tests/check_sprites.py
      - name: Validate round-trip save format
        run: lua tests/runfile.lua
      - name: Smoke test with sprite images
        run: lua tests/smoke.lua
      - name: Smoke test without sprite images
        run: lua tests/smoke.lua fallback
      - name: Check eight player directions
        run: lua tests/verify_directions.lua
      - name: Validate recovery, upgrades, pulse and rotating objectives
        run: lua tests/polish.lua
      - name: Test permanent gems, achievements and skin profile
        run: lua tests/progression.lua
      - name: Test experience and difficulty modes
        run: lua tests/experience.lua
      - name: Test menus and save slot actions
        run: lua tests/menu_flow.lua
      - name: Protect v4-v7 saves and isolated slots
        run: lua tests/v8_compatibility.lua
      - name: Protect economy and collection circuit
        run: lua tests/v8_economy.lua
      - name: Protect constant speed at 30, 60 and 120 fps
        run: lua tests/v8_physics.lua
      - name: Verify UI PNGs and font licenses
        run: python3 tests/check_ui_assets.py
      - name: Test nine-slice and resource fallback
        run: lua tests/ui_assets.lua
      - name: Test resized UI and disabled purchases
        run: lua tests/visual_flow.lua
      - name: Test store, challenges and round results
        run: lua tests/b2_flow.lua
      - name: Test purchase persistence failures
        run: lua tests/b2_persistence.lua
      - name: Test visual preferences and failure recovery
        run: lua tests/b3_preferences.lua
      - name: Test clear HUD, scaled settings and cosmetic-only effects
        run: lua tests/b3_hud.lua
      - name: Test separate run flows and visible recovery
        run: lua tests/c1_flow.lua
      - name: Test safe slot inspection, recovery and failure paths
        run: lua tests/c1_persistence.lua
      - name: Test session save failures and reward-free tutorial
        run: lua tests/c2_saving.lua
      - name: Test help cards, exit choices and tutorial controls
        run: lua tests/c2_flow.lua
      - name: Native session, recovery and complete tutorial with real files
        run: SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 25s love . --ci-flow
      - name: Capture native UI at five resolutions
        run: SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 60s love . --visual-check
      - name: Upload native UI captures
        uses: actions/upload-artifact@v4
        with:
          name: Balller-v8-C2-native-captures
          path: ~/.local/share/love/balller_visual_v8/captures/*.png
          if-no-files-found: error
      - name: Native LÖVE 2D rendering smoke test
        run: SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 25s love . --ci-smoke
      - name: Package .love distributable
        run: python3 tools/package_love.py --output Balller-v8-C2.love
      - name: Verify packaged native startup
        run: SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 25s love dist/Balller-v8-C2.love --ci-smoke
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: Balller-v8-C2-love
          path: dist/Balller-v8-C2.love
