name: Lua checks
on:
  push:
    branches: [main, development]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check syntax
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n 1 luac -p
      - name: Smoke test
        run: lua tests/smoke.lua
